"post":
  "tags":
    - "OAuth"
  "summary": "Exchange authorization code - illustrative"
  "operationId": "oauth_post_oauth_token"
  "description": "POST and form body are inferred from the OAuth flow. Saved response is illustrative.\n\nUGM documents this endpoint in its [OAuth 2.0/OIDC specification](https://oauth.simaster.ugm.ac.id/openapi.json). The Postman request is static evidence and was not live-tested.\n\nThe UGM schema lists only `grant_type` as universally required. This catalog describes the CLI Authorization Code + PKCE exchange; the CLI supplies the authorization code, registered redirect URI, client identifier, and PKCE verifier for that grant."
  "servers":
    -
      "url": "https://oauth.simaster.ugm.ac.id"
      "description": "Host recorded in the supplied collection."
  "requestBody":
    "required": true
    "description": "UGM documents grant_type as the only universally required form field. This operation describes the CLI Authorization Code + PKCE exchange, which also sends code, redirect_uri, client_id, and code_verifier."
    "content":
      "application/x-www-form-urlencoded":
        "schema":
          "type": "object"
          "properties":
            "grant_type":
              "type": "string"
              "enum":
                - "authorization_code"
            "code":
              "type": "string"
              "description": "Authorization code returned by the authorization endpoint; used with grant_type=authorization_code."
            "redirect_uri":
              "type": "string"
              "description": "Registered loopback redirect URI used for the authorization request."
            "client_id":
              "type": "string"
              "description": "Client identifier configured for this CLI installation."
            "code_verifier":
              "type": "string"
              "description": "PKCE verifier matching the authorization request code_challenge; required by the CLI PKCE flow."
          "required":
            - "grant_type"
          "additionalProperties": false
  "responses":
    "200":
      "description": "Illustrative token response. The collection response is illustrative and was not live-tested."
      "content":
        "application/json":
          "schema":
            "type": "object"
            "properties":
              "access_token":
                "type": "string"
              "refresh_token":
                "type": "string"
              "token_type":
                "type": "string"
              "expires_in":
                "type": "integer"
              "scope":
                "type": "string"
            "additionalProperties": true
          "examples":
            "illustrative":
              "summary": "Illustrative token response"
              "value":
                "access_token": "<redacted>"
                "refresh_token": "<redacted>"
                "token_type": "<redacted>"
                "expires_in": 3600
                "scope": "openid user.read userDetail.read"
  "x-status": "documented by UGM"
  "x-live-tested": false
  "x-provenance":
    "source": "SIMASTER Student vNEXT - Static APK Endpoint Catalog, supplied Postman collection generated from supplied APK splits on 2026-11-23"
    "requests":
      - "Exchange authorization code - illustrative"
    "officialDocumentation": "https://oauth.simaster.ugm.ac.id/openapi.json"
