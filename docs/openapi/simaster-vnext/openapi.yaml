  "title": "SIMASTER Student vNext and related API catalog"
  "version": "0.1.0"
  "summary": "Static APK-derived endpoint catalog. Endpoint behavior is unverified unless marked otherwise."
  "description": "Catalog generated from the supplied Postman collection, which records static APK analysis dated 2026-11-23 and no live traffic. The collection mixes UGM ID OAuth endpoints, SIMASTER vNext routes, legacy microservices, low-confidence route candidates, and external integrations. Duplicate requests with the same method and path share one operation. Saved response bodies are illustrative. Only the OAuth authorization and token endpoints are marked documented by UGM. All operations have x-live-tested: false. This reference does not authorize live requests. Use only an authorized environment and your own account. Page-navigation requests named SIMASTER services page, SIMASTER home page, Report page, ULT portal, RSA clinic page, DTI knowledge base are omitted. The Armada GPS WebSocket URL is omitted because OpenAPI does not describe its message frames or connection lifecycle."
